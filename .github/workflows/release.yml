name: Release

on:
  push:
    branches:
      - main
    paths:
      - atvloadly/config.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: "([^"]+)"$/\1/p' atvloadly/config.yaml)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "Invalid app version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.app.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes

      - name: Update changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.app.outputs.version }}
          VERSION: ${{ steps.app.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "^## ${VERSION}$" atvloadly/CHANGELOG.md; then
            echo "Changelog already contains ${VERSION}"
            exit 0
          fi

          notes="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          temporary_file="$(mktemp)"
          trap 'rm -f "${temporary_file}"' EXIT
          {
            echo "# Changelog"
            printf '\n## %s\n\n%s\n' "${VERSION}" "${notes}"
            sed -n '2,$p' atvloadly/CHANGELOG.md
          } > "${temporary_file}"
          mv "${temporary_file}" atvloadly/CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atvloadly/CHANGELOG.md
          git commit -m "docs: update changelog for ${TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
